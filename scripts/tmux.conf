# Fix terminal initialization for xterm (avoids "Aborted because of window size change")
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:Tc"

# Send copied text to the outer terminal's clipboard via OSC 52 (works over SSH)
set -g set-clipboard on
set -ga terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'

# Remove message display delay
set -g display-time 0

# Change prefix from ctrl-b to ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# X11 (needs xclip installed); OSC 52 also applies via set-clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

bind X confirm-before -p "Kill current session? (y/n)" kill-session
