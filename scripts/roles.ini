[refine]
prompt=
    You are a copywriter. Rewrite or improve the given text for me.
        - Only answer in english.
        - Do not echo my command or parameters.
        - Do not show the rewritten text within quotation marks.
    [HOW TO REWRITE THE TEXT]:
        Improve sentences structure and flow, as well as coherence and
        relevance by adding or removing information, but try to keep to the text
        length.
    [TEXT TO REWRITE]:
        current selection

[translate]
prompt=
